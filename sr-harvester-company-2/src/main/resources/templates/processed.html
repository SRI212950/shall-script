<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Processed Bill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-3">
    <h4>Processed Bill</h4>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered">
        <tr><th>Date</th><td th:text="${bill.billDate}"></td></tr>
        <tr><th>Customer</th><td th:text="${bill.customerName}"></td></tr>
        <tr><th>Mobile</th><td th:text="${bill.mobileNumber}"></td></tr>
        <tr><th>Start</th><td th:text="${bill.startTime}"/></tr>
        <tr><th>Stop</th><td th:text="${bill.stopTime}"/></tr>
        <tr><th>Hourly Rate</th><td th:text="${bill.hourlyRate}"></td></tr>
        <tr><th>Total</th><td><strong th:text="${bill.totalBill}"></strong></td></tr>
        <tr>
            <th>Paid</th>
            <td>
                <form method="post" th:action="@{/sr-harvester-company/save}">
                    <input type="hidden" name="id" th:value="${bill.id} ?: 0" />
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="paidCheckbox" name="paid" />
                        <label class="form-check-label" for="paidCheckbox">Paid</label>
                    </div>
                    <div class="mt-2">
                        <button id="saveBtn" class="btn btn-success" disabled>Save Bill</button>
                        <a href="/sr-harvester-company/" class="btn btn-secondary">Back</a>
                    </div>
                </form>
            </td>
        </tr>
    </table>
</div>

<script>
    const paidCheckbox = document.getElementById('paidCheckbox');
    const saveBtn = document.getElementById('saveBtn');
    if (paidCheckbox) {
        paidCheckbox.addEventListener('change', () => {
            saveBtn.disabled = !paidCheckbox.checked;
        });
    }
</script>
</body>
</html>
