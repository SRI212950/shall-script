<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SR Harvester Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 12px; }
        .container { max-width: 720px; margin:auto; }
    </style>
</head>
<body>
<div class="container">
    <h3 class="mb-3">SR Harvester Company — Harvester Calculator</h3>
    <form method="post" th:action="@{/sr-harvester-company/calculate}">
        <div class="mb-2">
            <label>Bill Date</label>
            <input type="date" name="billDate" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Customer Name</label>
            <input type="text" name="customerName" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Mobile Number</label>
            <input type="tel" name="mobileNumber" class="form-control" required>
        </div>
        <div class="row g-2">
            <div class="col-6">
                <label>Start Time (HH:MM)</label>
                <input type="time" name="startTime" class="form-control" required>
            </div>
            <div class="col-3">
                <label>AM/PM</label>
                <select name="startAmPm" class="form-select">
                    <option>AM</option>
                    <option>PM</option>
                </select>
            </div>
            <div class="col-6 mt-2">
                <label>Stop Time (HH:MM)</label>
                <input type="time" name="stopTime" class="form-control" required>
            </div>
            <div class="col-3 mt-2">
                <label>AM/PM</label>
                <select name="stopAmPm" class="form-select">
                    <option>AM</option>
                    <option>PM</option>
                </select>
            </div>
        </div>
        <div class="mb-2 mt-2">
            <label>Hourly Rate</label>
            <input type="number" step="0.01" name="hourlyRate" class="form-control" required>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Calculate</button>
            <a href="/sr-harvester-company/bills" class="btn btn-secondary">Bills</a>
        </div>
    </form>
</div>
</body>
</html>
